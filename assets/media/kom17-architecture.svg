<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">KOM17: from a monolith to modules</title><desc id="desc">Telegram webhook to FastAPI, aiogram 3, services, and five SQLite databases. Cutover completed 26 May 2026.</desc><rect width="1280" height="800" fill="#0c1524"/><g font-family="system-ui,sans-serif"><text x="70" y="80" fill="#8ee2c2" font-size="19" letter-spacing="3">KOM17 / ARCHITECTURE</text><text x="70" y="142" fill="#f0f4fb" font-size="42" font-weight="600">One request. One execution path.</text><text x="70" y="184" fill="#aebed2" font-size="21">Cutover completed · 26 May 2026</text><g fill="#14263d" stroke="#3e5678" stroke-width="2"><rect x="70" y="260" width="280" height="110" rx="12"/><rect x="500" y="260" width="280" height="110" rx="12"/><rect x="930" y="260" width="280" height="110" rx="12"/><rect x="430" y="455" width="420" height="90" rx="12"/></g><g fill="#f0f4fb" font-size="28" text-anchor="middle"><text x="210" y="324">Telegram</text><text x="640" y="308">FastAPI</text><text x="640" y="341" font-size="17" fill="#aebed2">validated webhook</text><text x="1070" y="308">aiogram 3</text><text x="1070" y="341" font-size="17" fill="#aebed2">routers + services</text><text x="640" y="510">SQLAlchemy · async</text></g><g fill="none" stroke="#8ee2c2" stroke-width="3"><path d="M365 315h113m-12-9 12 9-12 9M795 315h113m-12-9 12 9-12 9M1070 390v32H640v20m-9-12 9 12 9-12M640 560v40H150v25m490-25h490v25M390 600v25M640 600v25M885 600v25"/></g><rect x="50" y="630" width="220" height="70" rx="10" fill="#15312e" stroke="#5ba990"/><text x="160" y="673" fill="#c7f1e1" text-anchor="middle" font-size="21">users</text><rect x="295" y="630" width="220" height="70" rx="10" fill="#15312e" stroke="#5ba990"/><text x="405" y="673" fill="#c7f1e1" text-anchor="middle" font-size="21">economy</text><rect x="540" y="630" width="220" height="70" rx="10" fill="#15312e" stroke="#5ba990"/><text x="650" y="673" fill="#c7f1e1" text-anchor="middle" font-size="21">activity</text><rect x="785" y="630" width="220" height="70" rx="10" fill="#15312e" stroke="#5ba990"/><text x="895" y="673" fill="#c7f1e1" text-anchor="middle" font-size="21">moderation</text><rect x="1030" y="630" width="220" height="70" rx="10" fill="#15312e" stroke="#5ba990"/><text x="1140" y="673" fill="#c7f1e1" text-anchor="middle" font-size="21">message_stats</text><text x="640" y="750" fill="#aebed2" text-anchor="middle" font-size="18">Five databases · independent migration histories</text></g></svg>