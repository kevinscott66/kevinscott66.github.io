name: Static site checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check links, assets and page structure
        run: python3 tools/check_site.py
      - name: Test publication safeguards
        run: python3 tools/test_site.py
      - name: Install frontend build dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify camera and local demo lifecycle
        working-directory: frontend
        run: npm test
      - name: Verify committed homepage build
        working-directory: frontend
        run: |
          npm run build
          git diff --exit-code -- ../index.html ../ru/index.html ../assets/coreverse
